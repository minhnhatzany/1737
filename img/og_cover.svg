<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0508"/>
      <stop offset="40%" stop-color="#1a0a05"/>
      <stop offset="100%" stop-color="#2d1505"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="30%" stop-color="#7a5f24"/>
      <stop offset="50%" stop-color="#f5d980"/>
      <stop offset="70%" stop-color="#7a5f24"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- Mountains silhouette -->
  <polygon points="0,400 150,200 280,320 400,160 520,280 650,100 780,240 900,180 1020,300 1200,200 1200,630 0,630" fill="#0d0608" opacity="0.9"/>
  <polygon points="0,450 100,320 200,380 350,250 500,340 650,230 800,310 950,260 1100,340 1200,280 1200,630 0,630" fill="#080405" opacity="0.95"/>

  <!-- Rice fields silhouette -->
  <rect x="0" y="500" width="1200" height="130" fill="#050303"/>

  <!-- Grid lines suggesting fields -->
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#1a0d06" stroke-width="1"/>
  <line x1="0" y1="545" x2="1200" y2="545" stroke="#1a0d06" stroke-width="1"/>
  <line x1="0" y1="570" x2="1200" y2="570" stroke="#1a0d06" stroke-width="1"/>

  <!-- Pagoda silhouette left -->
  <g opacity="0.6">
    <rect x="80" y="340" width="6" height="120" fill="#2d1505"/>
    <polygon points="50,340 110,340 80,310" fill="#2d1505"/>
    <polygon points="55,310 105,310 80,285" fill="#2d1505"/>
    <polygon points="60,285 100,285 80,265" fill="#2d1505"/>
    <rect x="60" y="300" width="40" height="5" fill="#7a5f24" opacity="0.5"/>
    <rect x="63" y="275" width="34" height="4" fill="#7a5f24" opacity="0.5"/>
  </g>

  <!-- Pagoda silhouette right -->
  <g opacity="0.5">
    <rect x="1110" y="360" width="5" height="100" fill="#2d1505"/>
    <polygon points="1083,360 1138,360 1110,333" fill="#2d1505"/>
    <polygon points="1088,333 1132,333 1110,310" fill="#2d1505"/>
    <polygon points="1093,310 1127,310 1110,292" fill="#2d1505"/>
    <rect x="1090" y="322" width="40" height="4" fill="#7a5f24" opacity="0.4"/>
  </g>

  <!-- Torch flames top left/right -->
  <ellipse cx="200" cy="400" rx="8" ry="15" fill="#c9600a" opacity="0.7" filter="url(#glow)"/>
  <ellipse cx="200" cy="396" rx="5" ry="10" fill="#f5a020" opacity="0.9" filter="url(#glow)"/>
  <ellipse cx="1000" cy="410" rx="8" ry="15" fill="#c9600a" opacity="0.7" filter="url(#glow)"/>
  <ellipse cx="1000" cy="406" rx="5" ry="10" fill="#f5a020" opacity="0.9" filter="url(#glow)"/>

  <!-- Gold divider top -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#goldGlow)"/>
  <!-- Gold divider bottom -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#goldGlow)"/>

  <!-- Horizontal gold line -->
  <rect x="100" y="160" width="1000" height="1" fill="url(#goldGlow)" opacity="0.5"/>
  <rect x="100" y="460" width="1000" height="1" fill="url(#goldGlow)" opacity="0.5"/>

  <!-- Main title 1737 -->
  <text x="600" y="320" font-family="Georgia, serif" font-size="200" font-weight="bold"
        text-anchor="middle" fill="#f5d980" filter="url(#textGlow)" letter-spacing="20">1737</text>

  <!-- Subtitle -->
  <text x="600" y="395" font-family="Georgia, serif" font-size="36" font-style="italic"
        text-anchor="middle" fill="#c9973a" letter-spacing="6">Đàng Ngoài — Lê Trung Hưng</text>

  <!-- Ornamental diamonds -->
  <text x="340" y="400" font-family="serif" font-size="16" text-anchor="middle" fill="#7a5f24">◆</text>
  <text x="860" y="400" font-family="serif" font-size="16" text-anchor="middle" fill="#7a5f24">◆</text>

  <!-- Bottom tagline -->
  <text x="600" y="475" font-family="Georgia, serif" font-size="20"
        text-anchor="middle" fill="#5a5248" letter-spacing="3">GRAND STRATEGY SANDBOX · LỊCH SỬ VIỆT NAM</text>

  <!-- Credit -->
  <text x="1170" y="618" font-family="Georgia, serif" font-size="14"
        text-anchor="end" fill="#3a3028">Một sản phẩm của Ha Trung Vuong</text>

  <!-- Border frame -->
  <rect x="8" y="8" width="1184" height="614" fill="none" stroke="#7a5f24" stroke-width="2" opacity="0.4"/>
  <rect x="14" y="14" width="1172" height="602" fill="none" stroke="#3a2a10" stroke-width="1" opacity="0.3"/>
</svg>
